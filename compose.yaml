services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/hansana_portfolio
      NODE_ENV: production
      HOST: 0.0.0.0
      ALLOWED_ORIGINS: http://localhost:4000,http://127.0.0.1:4000
      COOKIE_SECURE: "false"
    volumes:
      - uploads:/app/backend/uploads
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo-data:
  uploads:
